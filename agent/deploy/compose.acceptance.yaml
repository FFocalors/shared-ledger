services:
  agent:
    entrypoint:
      - python
      - /opt/p1-06-acceptance/fixture_app.py
    command: ["--workers", "1"]
    environment:
      P1_06_TEST_FIXTURE: "1"
      P1_06_FIXTURE_MODE: simulation
      P1_06_APP_ROOT: /srv
      P1_06_HOLD_SECONDS: "8"
      AGENT_PROVIDER_MODE: mock
      AGENT_AGENT_ENABLED: "true"
      AGENT_MOCK_MODEL_TIMEOUT_SECONDS: "10"
      AGENT_SUPABASE_AUTH_BASE_URL: ""
      AGENT_SUPABASE_API_KEY: ""
      AGENT_CURSOR_SIGNING_SECRET: "p1-06-isolated-fixture-cursor-secret-32-bytes-minimum"
    volumes:
      - type: bind
        source: ./acceptance/fixture_app.py
        target: /opt/p1-06-acceptance/fixture_app.py
        read_only: true
      - type: bind
        source: ./acceptance/exercise.py
        target: /opt/p1-06-acceptance/exercise.py
        read_only: true
