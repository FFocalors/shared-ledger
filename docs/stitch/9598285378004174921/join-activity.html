<script>
        // Simple micro-interaction for input auto-advance
        const inputs = document.querySelectorAll('.code-input input');
        inputs.forEach((input, index) => {
            // Only allow numbers
            input.addEventListener('keypress', function(e) {
                if (e.key < '0' || e.key > '9') {
                    e.preventDefault();
                }
            });

            input.addEventListener('input', function() {
                if(this.value.length === 1 && index < inputs.length - 1) {
                    inputs[index + 1].focus();
                }
            });
            input.addEventListener('keydown', function(e) {
                if(e.key === 'Backspace' && this.value.length === 0 && index > 0) {
                    inputs[index - 1].focus();
                }
            });
        });

        // Toggle states for demonstration
        const btnFind = document.getElementById('btn-find');
        const stateInput = document.getElementById('state-input');
        const stateConfirm = document.getElementById('state-confirm');

        btnFind.addEventListener('click', () => {
            // Simulate loading
            const originalText = btnFind.innerHTML;
            btnFind.innerHTML = '<span class="material-symbols-outlined animate-spin">progress_activity</span>';

            setTimeout(() => {
                // Fade out state 1
                stateInput.classList.add('hidden');
                stateInput.classList.remove('flex');

                // Show state 2
                stateConfirm.classList.remove('hidden');
                stateConfirm.classList.add('flex');

                // Trigger reflow for transition
                void stateConfirm.offsetWidth;

                stateConfirm.classList.remove('opacity-0');
            }, 600);
        });
    </script>
