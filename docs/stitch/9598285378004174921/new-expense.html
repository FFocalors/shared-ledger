<!DOCTYPE html><html lang="zh-CN"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
<title>新增消费 - SharedLedger</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-tint": "#54643f",

                        "primary": "#54643f",
                        "on-surface-variant": "#45483e",
                        "secondary-container": "#fed39c",
                        "on-primary-fixed": "#121f03",

                        "error": "#ba1a1a",
                        "primary-fixed-dim": "#bbcda0",

                        "on-background": "#1b1c1c",

                        "on-tertiary-container": "#575449",
                        "on-secondary-fixed": "#2a1800",
                        "surface-dim": "#dbd9d9",
                        "inverse-on-surface": "#f2f0f0",
                        "on-tertiary-fixed": "#1e1b13",
                        "on-secondary-fixed-variant": "#5e4118",
                        "tertiary-fixed-dim": "#ccc6b8",
                        "surface-bright": "#fbf9f8",
                        "surface-container-low": "#f5f3f3",
                        "primary-container": "#bdcfa2",
                        "on-primary-container": "#495935",
                        "on-error-container": "#93000a",
                        "background": "#fbf9f8",

                        "surface-container-highest": "#e4e2e2",
                        "on-tertiary": "#ffffff",
                        "primary-fixed": "#d7e9ba",
                        "on-secondary-container": "#79592d",

                        "on-tertiary-fixed-variant": "#4a473c",

                        "inverse-primary": "#bbcda0"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "stack-lg": "32px",
                        "stack-md": "16px",
                        "gutter-card": "16px",
                        "stack-sm": "8px",
                        "base": "4px",
                        "margin-page": "24px"
                    },
                    "fontFamily": {
                        "headline-lg": ["Inter"],
                        "display-amount": ["Inter"],
                        "body-lg": ["Inter"],
                        "label-md": ["Inter"],
                        "title-md": ["Inter"],
                        "headline-lg-mobile": ["Inter"],
                        "body-md": ["Inter"]

                    "fontSize": {
                        "headline-lg": ["28px", { "lineHeight": "34px", "fontWeight": "600" }],

                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],

<style>
        body { background-color: #fbf9f8; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        .filled-icon { font-variation-settings: 'FILL' 1; }
    </style>
</head>
<body class="text-on-background antialiased flex justify-center min-h-screen">
<div class="w-full max-w-[480px] bg-background relative flex flex-col h-full shadow-lg overflow-hidden">
<!-- TopAppBar -->
<header class="bg-background flex justify-between items-center px-margin-page py-4 w-full max-w-[480px] mx-auto z-10 sticky top-0">
<button class="flex items-center justify-center p-2 rounded-full hover:bg-surface-container-low transition-colors text-on-surface-variant scale-95 active:scale-90 transition-transform">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
<h1 class="text-title-md font-title-md text-on-surface">新增消费</h1>
<div class="w-10"></div> <!-- Placeholder for balance -->
</header>
<!-- Main Content Canvas -->
<main class="flex-1 overflow-y-auto px-margin-page pb-[100px] flex flex-col gap-stack-lg mt-4">
<!-- Section 1: Amount Input -->
<section class="bg-surface-container-lowest rounded-[24px] p-6 shadow-[0_4px_24px_rgba(0,0,0,0.03)] border border-outline-variant/30 flex flex-col gap-4">
<div class="flex items-center gap-2 text-on-surface-variant">
<span class="material-symbols-outlined filled-icon text-secondary" data-icon="restaurant">restaurant</span>
<input class="bg-transparent border-none text-title-md font-title-md text-on-surface focus:ring-0 p-0 placeholder:text-outline-variant w-full" placeholder="消费名称" type="text" value="晚餐">
</div>
<div class="flex items-baseline gap-2 pb-2 border-b border-surface-variant">
<span class="text-title-md font-title-md text-on-surface-variant">¥</span>
<input class="bg-transparent border-none text-display-amount font-display-amount text-on-surface focus:ring-0 p-0 w-full placeholder:text-outline-variant" placeholder="0.00" type="number" value="300.0">
</div>
</section>
<!-- Section 2: Payer -->
<section class="bg-surface-container-lowest rounded-[24px] p-6 shadow-[0_4px_24px_rgba(0,0,0,0.03)] border border-outline-variant/30 flex flex-col gap-stack-md">
<div class="flex justify-between items-center">
<h2 class="text-body-md font-body-md text-on-surface-variant">实际付款</h2>
<button class="flex items-center gap-1 text-primary text-label-md font-label-md bg-primary-container/20 px-3 py-1.5 rounded-full hover:bg-primary-container/40 transition-colors">
<span class="material-symbols-outlined text-[16px]" data-icon="add">add</span>
                        添加付款人
                    </button>
</div>
<div class="flex flex-col gap-3">
<div class="flex justify-between items-center bg-surface-container-low p-3 rounded-xl border border-surface-variant/50">
<div class="flex items-center gap-3">
<div class="w-8 h-8 rounded-full bg-secondary-container flex items-center justify-center text-on-secondary-container font-title-md">A</div>
<span class="text-body-lg font-body-lg">Alice</span>
</div>
<span class="text-body-lg font-body-lg font-medium">¥ 200.00</span>
</div>
<div class="flex justify-between items-center bg-surface-container-low p-3 rounded-xl border border-surface-variant/50">
<div class="flex items-center gap-3">
<div class="w-8 h-8 rounded-full bg-tertiary-container flex items-center justify-center text-on-tertiary-container font-title-md">B</div>
<span class="text-body-lg font-body-lg">Bob</span>
</div>
<span class="text-body-lg font-body-lg font-medium">¥ 100.00</span>
</div>
</div>
</section>
<!-- Section 3: Split -->
<section class="bg-surface-container-lowest rounded-[24px] p-6 shadow-[0_4px_24px_rgba(0,0,0,0.03)] border border-outline-variant/30 flex flex-col gap-stack-md">
<div class="flex justify-between items-center">
<h2 class="text-body-md font-body-md text-on-surface-variant">分摊方式</h2>
<div class="bg-surface-container flex rounded-full p-1 relative">
<button class="px-4 py-1.5 text-label-md font-label-md rounded-full bg-surface-container-lowest shadow-sm text-on-surface z-10">手动分摊</button>
<button class="px-4 py-1.5 text-label-md font-label-md rounded-full text-on-surface-variant z-10 hover:text-on-surface transition-colors">AA均摊</button>
</div>
</div>
<div class="flex justify-between items-center py-2">
<span class="text-label-md font-label-md text-primary bg-primary-container/30 px-3 py-1 rounded-full flex items-center gap-1">
<span class="material-symbols-outlined text-[14px] filled-icon" data-icon="check_circle">check_circle</span>
                        已分配 ¥ 300 / ¥ 300
                    </span>
</div>
<div class="flex flex-col gap-3">
<div class="flex items-center gap-3 bg-surface-container-low p-3 rounded-xl border border-surface-variant/50">
<div class="w-8 h-8 rounded-full bg-secondary-container flex items-center justify-center text-on-secondary-container font-title-md">A</div>
<span class="text-body-lg font-body-lg flex-1">Alice</span>
<div class="flex items-center bg-surface-container-lowest rounded-lg px-3 py-1.5 border border-outline-variant/50 w-24">
<span class="text-label-md text-outline-variant mr-1">¥</span>
<input class="bg-transparent border-none text-body-lg font-body-lg text-on-surface focus:ring-0 p-0 w-full text-right" placeholder="0.00" type="number" value="80.00">
</div>
</div>
<div class="flex items-center gap-3 bg-surface-container-low p-3 rounded-xl border border-surface-variant/50">
<div class="w-8 h-8 rounded-full bg-tertiary-container flex items-center justify-center text-on-tertiary-container font-title-md">B</div>
<span class="text-body-lg font-body-lg flex-1">Bob</span>
<div class="flex items-center bg-surface-container-lowest rounded-lg px-3 py-1.5 border border-outline-variant/50 w-24">
<span class="text-label-md text-outline-variant mr-1">¥</span>
<input class="bg-transparent border-none text-body-lg font-body-lg text-on-surface focus:ring-0 p-0 w-full text-right" placeholder="0.00" type="number" value="100.00">
</div>
</div>
<div class="flex items-center gap-3 bg-surface-container-low p-3 rounded-xl border border-surface-variant/50">
<div class="w-8 h-8 rounded-full bg-primary-container flex items-center justify-center text-on-primary-container font-title-md">C</div>
<span class="text-body-lg font-body-lg flex-1">Charlie</span>
<div class="flex items-center bg-surface-container-lowest rounded-lg px-3 py-1.5 border border-outline-variant/50 w-24">
<span class="text-label-md text-outline-variant mr-1">¥</span>
<input class="bg-transparent border-none text-body-lg font-body-lg text-on-surface focus:ring-0 p-0 w-full text-right" placeholder="0.00" type="number" value="120.00">
</div>
</div>
</div>
</section>
<!-- Section 4: Details -->
<section class="bg-surface-container-lowest rounded-[24px] p-6 shadow-[0_4px_24px_rgba(0,0,0,0.03)] border border-outline-variant/30 flex flex-col gap-4">
<div class="flex items-center gap-3 text-on-surface-variant">
<span class="material-symbols-outlined" data-icon="schedule">schedule</span>
<input class="bg-transparent border-none text-body-lg font-body-lg text-on-surface focus:ring-0 p-0 w-full" type="text" value="今天 19:42">
</div>
<div class="h-[1px] bg-surface-variant w-full"></div>
<div class="flex items-start gap-3 text-on-surface-variant">
<span class="material-symbols-outlined mt-1" data-icon="edit_note">edit_note</span>
<textarea class="bg-transparent border-none text-body-lg font-body-lg text-on-surface focus:ring-0 p-0 w-full placeholder:text-outline-variant resize-none" placeholder="添加备注 (可选)..." rows="2"></textarea>
</div>
<div class="h-[1px] bg-surface-variant w-full"></div>
<div class="flex items-center gap-3 text-on-surface-variant">
<span class="material-symbols-outlined" data-icon="image">image</span>
<button class="w-16 h-16 rounded-xl border-2 border-dashed border-outline-variant flex items-center justify-center text-outline-variant hover:bg-surface-container-low transition-colors">
<span class="material-symbols-outlined" data-icon="add">add</span>
</button>
</div>
</section>
</main>
<!-- Bottom CTA -->
<div class="fixed bottom-0 left-0 right-0 w-full max-w-[480px] mx-auto bg-gradient-to-t from-background via-background to-transparent pt-8 pb-6 px-margin-page z-20">
<button class="w-full bg-[#f4a261] text-white text-title-md font-title-md py-4 rounded-full shadow-[0_8px_24px_rgba(244,162,97,0.3)] hover:opacity-90 active:scale-[0.98] transition-all flex items-center justify-center gap-2">
                保存
                <span class="material-symbols-outlined filled-icon" data-icon="save">save</span>
</button>
</div>
</div>
</body></html>
